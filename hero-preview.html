<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JC Hero 预览 + 热点校准</title>
<style>
  :root{ --brass:#a87d2a; --brass-lt:#c9a24e; --chalk:#f0ebe2; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,'Segoe UI',sans-serif;background:#0e0c0a;color:#e8e2d6;padding:16px;line-height:1.5}
  h1{font-size:1.1rem;color:var(--chalk)}
  .hint{font-size:.8rem;color:#a99f8f;margin:4px 0 12px}
  .hint b{color:var(--brass-lt)}
  .layout{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .stage-wrap{flex:1 1 640px;min-width:320px}
  .stage{position:relative;display:block;width:100%;border:1px solid #2a241c;border-radius:8px;overflow:hidden;touch-action:none;user-select:none;background:#0a0908;aspect-ratio:1672/940}
  .stage .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transition:opacity 1.1s ease}
  .stage .night{opacity:0}
  .stage.is-night .night{opacity:1}
  .toolbar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .toolbar button{background:#241f18;color:#e8e2d6;border:1px solid #3a3226;border-radius:6px;padding:7px 12px;font-size:.8rem;cursor:pointer}
  .toolbar button.on{background:var(--brass);color:#fff;border-color:var(--brass)}
  .toolbar .status{font-size:.78rem;color:#a99f8f;margin-left:auto}
  .toolbar .status b{color:var(--brass-lt)}
  /* markers */
  .mk{position:absolute;transform:translate(-50%,-50%);z-index:6;cursor:grab;display:flex;align-items:center;gap:7px;touch-action:none;white-space:nowrap}
  .mk:active{cursor:grabbing}
  .mk .dot{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--brass-lt) 45%,var(--brass) 80%);box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 9px 3px rgba(245,169,78,.85);flex:none}
  .mk.sel .dot{background:radial-gradient(circle,#fff 0%,#ff6b8a 45%,#ff2d55 80%);box-shadow:0 0 0 2px #fff,0 0 12px 4px rgba(255,45,85,.9)}
  .mk .tag{font-size:11px;font-weight:700;color:#fff;background:rgba(10,8,6,.82);padding:2px 7px;border-radius:6px;text-shadow:0 1px 2px #000}
  .mk .num{font-size:9px;color:#0e0c0a;background:var(--brass-lt);width:15px;height:15px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;flex:none}
  /* panel */
  .panel{flex:0 0 310px;background:#171310;border:1px solid #2a241c;border-radius:10px;padding:14px}
  .panel h2{font-size:.85rem;color:var(--brass-lt);margin-bottom:9px}
  .rows{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:7px;font-size:.76rem;padding:5px 7px;border-radius:6px;cursor:pointer;background:#0f0c0a;border:1px solid transparent}
  .row:hover{border-color:#3a3226}
  .row.sel{border-color:var(--brass);background:#1c1710}
  .row .rn{width:17px;height:17px;border-radius:50%;background:var(--brass);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;flex:none}
  .row .rt{flex:1;color:#d8cfc0;overflow:hidden;text-overflow:ellipsis}
  .row .rc{color:#8a8175;font-variant-numeric:tabular-nums;font-size:.7rem}
  textarea{width:100%;height:170px;background:#0b0908;color:#cde6b8;border:1px solid #2a241c;border-radius:6px;padding:9px;font-family:ui-monospace,Consolas,monospace;font-size:.71rem;resize:vertical}
  .btns{display:flex;gap:8px;margin-top:9px}
  .btns button{flex:1;background:var(--brass);color:#fff;border:0;border-radius:7px;padding:9px;font-weight:600;font-size:.8rem;cursor:pointer}
  .btns button:hover{background:var(--brass-lt)}
  .btns button.ghost{background:#241f18}
  .ok{color:#8fd66a;font-size:.74rem;margin-top:7px;min-height:1em}
</style>
</head>
<body>
  <h1>JC Hero 预览 + 热点校准</h1>
  <div class="hint">白天默认，每 <b>10 秒</b>自动切夜晚。把每个金点<b>拖到</b>对应场景区域，右侧实时显示坐标。校准时可点 <b>暂停切换</b> 定住画面。拖好点 <b>复制坐标</b> 发我，我锁进正式站。</div>
  <div class="layout">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <img class="layer day" id="dayImg" src="hero-day-2k.webp" alt="day scene">
        <img class="layer night" id="nightImg" src="hero-night-2k.webp" alt="night scene">
      </div>
      <div class="toolbar">
        <button id="btnAuto" class="on">⏱ 自动切换 (10s)</button>
        <button id="btnDay">☀ 白天</button>
        <button id="btnNight">🌙 夜晚</button>
        <span class="status">当前：<b id="curMode">白天</b></span>
      </div>
    </div>
    <div class="panel">
      <h2>11 个产品应用场景热点</h2>
      <div class="rows" id="rows"></div>
      <textarea id="out" readonly></textarea>
      <div class="btns">
        <button id="copy">复制坐标</button>
        <button class="ghost" id="reset">重置</button>
      </div>
      <div class="ok" id="ok"></div>
    </div>
  </div>

<script>
// 11 场景 + 初始坐标(基于新图目测,你再拖动微调)
const DEFAULTS = [
  {n:'Agriculture & Farms',    z:'农业/温室',   k:'app_agri',    x:27, y:22},
  {n:'Commercial & Retail',    z:'商业/城市高楼', k:'app_comm',   x:62, y:12},
  {n:'Port & Marine',          z:'港口',        k:'app_port',    x:90, y:20},
  {n:'Industrial & Warehouse', z:'工业/仓库',   k:'app_indus',   x:65, y:33},
  {n:'Street & Road Lighting', z:'道路/主干道', k:'app_street',  x:47, y:55},
  {n:'Sports Lighting',        z:'运动场',      k:'app_sports',  x:80, y:42},
  {n:'Villa & Garden',         z:'别墅庭院',    k:'app_villa',   x:18, y:48},
  {n:'Parking Area',           z:'停车场',      k:'app_park',    x:90, y:56},
  {n:'Landscape & Garden',     z:'景观/花园',   k:'app_land',    x:30, y:42},
  {n:'Off-grid & Solar Home',  z:'光伏民居',    k:'app_offgrid', x:69, y:52},
  {n:'Camping & Portable',     z:'露营地',      k:'app_camp',    x:15, y:63}
];
let SW = JSON.parse(JSON.stringify(DEFAULTS));
const stage=document.getElementById('stage'), dayImg=document.getElementById('dayImg'), out=document.getElementById('out'), rowsEl=document.getElementById('rows');
let sel=0;

function outText(){ return SW.map(s=>s.k+': ['+s.x.toFixed(1)+','+s.y.toFixed(1)+']  // '+s.z+' — '+s.n).join('\n'); }
function render(){
  stage.querySelectorAll('.mk').forEach(m=>m.remove());
  SW.forEach((s,i)=>{
    const m=document.createElement('div');
    m.className='mk'+(i===sel?' sel':''); m.style.left=s.x+'%'; m.style.top=s.y+'%'; m.dataset.i=i;
    m.innerHTML='<span class="num">'+(i+1)+'</span><span class="dot"></span><span class="tag">'+s.z+'</span>';
    stage.appendChild(m);
  });
  rowsEl.innerHTML='';
  SW.forEach((s,i)=>{
    const r=document.createElement('div'); r.className='row'+(i===sel?' sel':'');
    r.innerHTML='<span class="rn">'+(i+1)+'</span><span class="rt">'+s.z+' · '+s.n+'</span><span class="rc">'+s.x.toFixed(1)+','+s.y.toFixed(1)+'</span>';
    r.onclick=()=>{ sel=i; render(); };
    rowsEl.appendChild(r);
  });
  out.value=outText();
}
// drag
let active=null;
stage.addEventListener('pointerdown', e=>{ const mk=e.target.closest('.mk'); if(!mk)return; active=mk; sel=+mk.dataset.i; mk.setPointerCapture(e.pointerId); render(); e.preventDefault(); });
stage.addEventListener('pointermove', e=>{
  if(!active)return;
  const r=dayImg.getBoundingClientRect();
  let x=Math.max(0,Math.min(100,Math.round((e.clientX-r.left)/r.width*1000)/10));
  let y=Math.max(0,Math.min(100,Math.round((e.clientY-r.top)/r.height*1000)/10));
  const i=+active.dataset.i; SW[i].x=x; SW[i].y=y;
  active.style.left=x+'%'; active.style.top=y+'%';
  rowsEl.children[i].querySelector('.rc').textContent=x.toFixed(1)+','+y.toFixed(1);
  out.value=outText();
});
stage.addEventListener('pointerup', ()=>{active=null;});
stage.addEventListener('pointercancel', ()=>{active=null;});
// day/night
let auto=true, isNight=false, timer=null;
const curMode=document.getElementById('curMode');
function setMode(night){ isNight=night; stage.classList.toggle('is-night',night); curMode.textContent=night?'夜晚':'白天'; }
function startAuto(){ auto=true; document.getElementById('btnAuto').classList.add('on'); clearInterval(timer); timer=setInterval(()=>setMode(!isNight),10000); }
function stopAuto(){ auto=false; document.getElementById('btnAuto').classList.remove('on'); clearInterval(timer); }
document.getElementById('btnAuto').onclick=()=>{ auto?stopAuto():startAuto(); };
document.getElementById('btnDay').onclick=()=>{ stopAuto(); setMode(false); };
document.getElementById('btnNight').onclick=()=>{ stopAuto(); setMode(true); };
// copy / reset
document.getElementById('copy').onclick=()=>{ navigator.clipboard.writeText(out.value).then(()=>{ document.getElementById('ok').textContent='✓ 已复制，粘贴发给 Claude'; setTimeout(()=>document.getElementById('ok').textContent='',2500); }).catch(()=>{ out.select(); document.execCommand('copy'); document.getElementById('ok').textContent='✓ 已复制'; }); };
document.getElementById('reset').onclick=()=>{ SW=JSON.parse(JSON.stringify(DEFAULTS)); sel=0; render(); };

render(); startAuto();
</script>
</body>
</html>
